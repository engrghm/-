<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন — InvestPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav"><div class="wrap"><a class="brand" href="/">Invest<span>Pro</span></a></div></nav>
  <main class="wrap">
    <div class="auth-box card">
      <div class="tabs">
        <button type="button" data-mode="login" class="on">লগইন</button>
        <button type="button" data-mode="register">নতুন অ্যাকাউন্ট</button>
      </div>
      <form id="form" novalidate>
        <div class="field hidden" id="name-field">
          <label for="name">পুরো নাম</label>
          <input id="name" autocomplete="name" maxlength="80">
        </div>
        <div class="field">
          <label for="email">ইমেইল</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">পাসওয়ার্ড</label>
          <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <div id="msg"></div>
        <button class="btn block" id="submit">লগইন</button>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
