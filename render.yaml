# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
# A persistent disk is required (SQLite lives on it), which needs a paid instance.
services:
  - type: web
    name: investpro
    runtime: docker
    plan: starter
    branch: claude/investment-website-platform-j3lnb6
    healthCheckPath: /api/plans
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
